---
name: "Build Containers"

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-containers-common:
    runs-on: ubuntu-latest
    outputs:
      containerver: ${{ steps.getcontainerver.outputs.containerver }}
    steps:
      - name: Get Container Version
        id: getcontainerver
        run: |
          echo "containerver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  build-containers:
    # GITHUB_TOKEN necesita este permiso explicito para publicar en GHCR;
    # sin el, el push falla con 403.
    permissions:
      contents: read
      packages: write
    needs: build-containers-common
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          NEXT_PUBLIC_VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile --target runtime \
            -t ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-${{ matrix.arch }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --cache-from type=gha,scope=${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.arch }} \
            --provenance=false --sbom=false \
            --output "type=registry,name=ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-${{ matrix.arch }}" .

  build-container-manifest:
    # GITHUB_TOKEN necesita este permiso explicito para publicar en GHCR;
    # sin el, el push falla con 403.
    permissions:
      contents: read
      packages: write
    needs: [build-containers, build-containers-common]
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          # Verify the architecture images
          echo "Verifying AMD64 image:"
          docker buildx imagetools inspect ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-amd64
          
          echo "Verifying ARM64 image:"
          docker buildx imagetools inspect ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-arm64
          
          # Try to remove any existing manifests first
          docker manifest rm ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }} || true
          docker manifest rm ghcr.io/alfredoditullio/sonrisapost:latest || true
          
          # Create and push the version-specific manifest
          docker manifest create ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }} \
            --amend ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-amd64 \
            --amend ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-arm64

          docker manifest push ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}

          # Create and push the latest manifest
          docker manifest create ghcr.io/alfredoditullio/sonrisapost:latest \
            --amend ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-amd64 \
            --amend ghcr.io/alfredoditullio/sonrisapost:${{ env.CONTAINERVER }}-arm64

          docker manifest push ghcr.io/alfredoditullio/sonrisapost:latest

      - name: Verify Manifest
        run: |
          docker manifest inspect ghcr.io/alfredoditullio/sonrisapost:latest
