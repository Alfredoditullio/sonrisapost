# Despliegue de produccion de SonrisaPost.
#
# Pensado para Coolify sobre un VPS que YA corre otra aplicacion en produccion.
# De ahi las dos decisiones que mas condicionan este archivo:
#
#   1. Cada servicio tiene limite de memoria. Sin limites, un pico del
#      orchestrator dispara el OOM killer del host, que no elige por proyecto:
#      mata el proceso mas grande, y ese puede ser la app del vecino.
#
#   2. Elasticsearch esta presente aunque consuma ~1 GB. Intentamos quitarlo
#      usando Postgres para visibilidad, pero la aplicacion no arranca: con
#      visibilidad SQL, Temporal solo admite 3 atributos de busqueda por tipo.
#
# El proxy y los certificados los pone Coolify (Traefik + Let's Encrypt). Este
# archivo no expone puertos al host salvo los que Coolify necesita rutear.
#
# Los limites de memoria salen de medir los tres procesos corriendo en la
# imagen real, no de estimaciones. Total en reposo: ~940 MB de aplicacion, mas
# Postgres, Redis y Temporal.
#
# NO se declaran redes a proposito. Coolify crea una red por stack y conecta
# ahi su proxy. Al declarar redes propias, los contenedores quedaban con varias
# interfaces y Traefik elegia la IP equivocada para rutear: el sintoma era un
# 504 contra un contenedor sano. La separacion de redes es un lujo que no vale
# lo que cuesta en este entorno.
#
# Las variables sensibles NO viven aca: se cargan desde el panel de Coolify.
# Ver DEPLOY.md para la lista completa.

x-app-base: &app-base
  image: ${SONRISAPOST_IMAGE:-ghcr.io/alfredoditullio/sonrisapost:latest}
  # Solo descargar si la imagen no esta en disco. La ruta IPv6 de Contabo hacia
  # GHCR se corta en transferencias largas, y volver a bajar 834 MB en cada
  # despliegue convierte un cambio de texto en una loteria. Para actualizar,
  # se cambia el tag en SONRISAPOST_IMAGE: al ser una imagen distinta, la baja.
  pull_policy: missing
  restart: unless-stopped
  env_file:
    - .env
  # Sin esto, los logs de un contenedor que falla en bucle llenan el disco del
  # host en horas y se lleva puesta la otra aplicacion.
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # ------------------------------------------------------------------
  # Web (Next.js) — sirve la landing y la aplicacion
  # ------------------------------------------------------------------
  frontend:
    <<: *app-base
    working_dir: /app/apps/frontend
    command: ['node', '../../node_modules/.bin/next', 'start', '-p', '4200']
    environment:
      PORT: 4200
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:4200/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Medido en reposo: 68 MB. El limite deja margen para el SSR bajo carga.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy

  # ------------------------------------------------------------------
  # API (NestJS)
  # ------------------------------------------------------------------
  backend:
    <<: *app-base
    working_dir: /app/apps/backend
    command:
      [
        'node',
        '--experimental-require-module',
        './dist/apps/backend/src/main.js',
      ]
    environment:
      PORT: 3000
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    # Medido en reposo: 455 MB. Limite al doble para absorber picos.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    # El backend se registra contra Temporal en el arranque
    # (TemporalRegister.onModuleInit): sin el motor disponible entra en bucle
    # de reinicio. Verificado levantando la imagen sin esta dependencia.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Orchestrator (workers de Temporal) — es quien publica los posts
  # ------------------------------------------------------------------
  orchestrator:
    <<: *app-base
    working_dir: /app/apps/orchestrator
    command:
      [
        'node',
        '--experimental-require-module',
        './dist/apps/orchestrator/src/main.js',
      ]
    environment:
      ORCHESTRATOR_PORT: 3002
    # Este healthcheck verifica de verdad la conexion con Temporal, no solo que
    # el proceso este vivo. Un worker desconectado no publica nada y desde
    # afuera se ve igual de "arriba" que uno sano.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3002/health/status']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    # Medido en reposo: 415 MB. Sube con la cantidad de colas activas.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Datos de la aplicacion
  # ------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sonrisapost}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./var/docker/backup.sh:/usr/local/bin/backup.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # appendonly deja los datos en disco: sin esto, un reinicio pierde la cola
    # y los trabajos en vuelo.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ------------------------------------------------------------------
  # Temporal — motor de los posts programados
  # ------------------------------------------------------------------
  # Elasticsearch es el backend de visibilidad de Temporal.
  #
  # Lo habia quitado para ahorrar ~1.2 GB, con Postgres como reemplazo. Fue un
  # error: con visibilidad SQL, Temporal admite como maximo 3 atributos de
  # busqueda por tipo (son columnas fijas del esquema), y el backend no logra
  # registrar los suyos. Falla al arrancar con:
  #   "cannot have more than 3 search attribute of type Text"
  #
  # Con Elasticsearch ese limite no existe. Es la configuracion con la que
  # upstream construye y prueba la aplicacion.
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?falta TEMPORAL_DB_PASSWORD}
      # Declarado explicitamente a proposito. Coolify inyecta las variables
      # globales del proyecto en TODOS los contenedores del compose, asi que
      # el POSTGRES_DB de la aplicacion se filtraba aca y Postgres creaba la
      # base con el nombre equivocado. Temporal entraba en bucle de reinicio
      # con "database temporal does not exist".
      POSTGRES_DB: temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal -d temporal']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?falta TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
      ENABLE_ES: 'true'
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
      TEMPORAL_NAMESPACE: default
      # Temporal escucha en 127.0.0.1 por defecto: ningun otro contenedor lo
      # alcanza, ni siquiera su propio script de arranque. Sin esto el proceso
      # corre pero nadie puede conectarse, y el sintoma es un backend colgado
      # con ECONNREFUSED contra un contenedor que figura "Up".
      BIND_ON_IP: 0.0.0.0
    depends_on:
      temporal-postgres:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    # Temporal tarda entre 30 y 60 segundos en aceptar conexiones. Sin este
    # healthcheck, quienes dependen de el arrancan demasiado pronto, fallan la
    # inicializacion y quedan colgados aunque Temporal despues levante bien.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bash -c "exec 3<>/dev/tcp/127.0.0.1/7233" 2>/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  elasticsearch-data:
  postgres-data:
  redis-data:
  temporal-data:

